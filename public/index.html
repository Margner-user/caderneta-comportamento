<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caderneta de Comportamento</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo">📘</span>
      <div><h1>Caderneta</h1><small>Comportamento escolar</small></div>
    </div>
    <div class="utilizador">
      <div class="user-info"><strong id="user-nome"></strong><small id="user-perfil"></small></div>
      <a id="link-utilizadores" href="/utilizadores.html" class="btn btn-claro" hidden>Utilizadores</a>
      <button id="btn-sair" class="btn btn-claro">Sair</button>
    </div>
  </header>

  <main>
    <section class="estatisticas">
      <div class="stat"><span class="stat-icone">🎓</span><div><b id="est-alunos">0</b><small>Alunos registados</small></div></div>
      <div class="stat"><span class="stat-icone">⏳</span><div><b id="est-ocorrencias">0</b><small>Ocorrências pendentes</small></div></div>
      <div class="stat grave"><span class="stat-icone">🔴</span><div><b id="est-graves">0</b><small>Graves pendentes</small></div></div>
    </section>

    <section class="barra">
      <input id="pesquisa" type="search" placeholder="Pesquisar por nome ou sala...">
      <select id="f-classe"><option value="">Todas as classes</option></select>
      <select id="f-turma"><option value="">Todas as turmas</option></select>
      <button id="btn-novo-aluno" class="btn">+ Novo aluno</button>
    </section>
    <p id="info-lista" class="suave info-lista"></p>
    <section id="painel-online" class="cartao-online" hidden>
      <div class="online-topo">
        <h2>Utilizadores online <span id="online-total" class="chip">0</span></h2>
        <small class="suave">Atividade nos últimos 5 minutos</small>
      </div>
      <div id="online-lista"></div>
    </section>
    <div id="resultados" class="lista"></div>
  </main>

  <!-- Janela: perfil do aluno -->
  <dialog id="dlg-perfil"><div id="perfil-conteudo" class="perfil"></div></dialog>

  <!-- Janela: registar aluno -->
  <dialog id="dlg-aluno">
       <form id="form-aluno" class="dialogo">
      <h2>Registar aluno</h2>
      <label>Nome completo
        <input name="nome" required minlength="5" maxlength="80" autocomplete="off"
          pattern="[^0-9]{5,80}" title="Escreva o nome completo, sem números (ex.: João Vicente)">
      </label>
      <label>Classe
        <select name="classe" id="sel-classe-novo" required>
          <option value="">Escolha a classe...</option>
          <option>1ª Classe</option><option>2ª Classe</option><option>3ª Classe</option>
          <option>4ª Classe</option><option>5ª Classe</option><option>6ª Classe</option>
          <option>7ª Classe</option><option>8ª Classe</option><option>9ª Classe</option>
          <option>10ª Classe</option><option>11ª Classe</option><option>12ª Classe</option>
          <option>13ª Classe</option>
        </select>
      </label>
      <div class="duas-colunas">
        <label>Turma
          <input name="turma" placeholder="Ex.: A" required maxlength="3" style="text-transform:uppercase"
            pattern="[A-Za-z0-9]{1,3}" title="1 a 3 letras ou números (ex.: A, B, 2, A1)">
        </label>
        <label>Sala
          <input name="sala" placeholder="Ex.: 12" required maxlength="10"
            pattern="[A-Za-z0-9][A-Za-z0-9 ]{0,9}" title="Letras e números (ex.: 12, B3, Lab 1)">
        </label>
      </div>
      <label>Nº de emergência
        <input name="emergencia" type="tel" inputmode="numeric" placeholder="923456789" required
          pattern="\+?[0-9]{9,15}" title="Só dígitos, 9 a 15 (ex.: 923456789 ou +244923456789)">
      </label>
      <label>Nº do encarregado
        <input name="encarregado" type="tel" inputmode="numeric" placeholder="923456789" required
          pattern="\+?[0-9]{9,15}" title="Só dígitos, 9 a 15 (ex.: 923456789 ou +244923456789)">
      </label>
      <p id="erro-aluno" class="erro"></p>
      <div class="dialogo-acoes">
        <button type="button" class="btn btn-claro-esc" data-fechar="dlg-aluno">Cancelar</button>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Janela: nova ocorrência -->
  <dialog id="dlg-ocorrencia">
    <form id="form-ocorrencia" class="dialogo">
      <h2 id="titulo-ocorrencia">Nova ocorrência</h2>
      <label>Categoria <select id="categoria" required></select></label>

      <div>
        <span class="rotulo">Gravidade</span>
        <div class="gravidades">
          <label class="pilula leve"><input type="radio" name="gravidade" value="leve" checked><span>Leve</span></label>
          <label class="pilula media"><input type="radio" name="gravidade" value="media"><span>Média</span></label>
          <label class="pilula grave"><input type="radio" name="gravidade" value="grave"><span>Grave</span></label>
        </div>
      </div>

      <label>Descrição <textarea id="descricao" rows="4" placeholder="O que aconteceu?" required></textarea></label>
      <p id="erro-ocorrencia" class="erro"></p>
      <div class="dialogo-acoes">
        <button type="button" class="btn btn-claro-esc" data-fechar="dlg-ocorrencia">Cancelar</button>
        <button type="submit" class="btn">Registar</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
