<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caderneta de Comportamento</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Caderneta de Comportamento</h1></header>
  <main>
    <section class="cartao">
      <h2>Registar aluno</h2>
      <div id="form-aluno" class="grelha">
        <input id="nome" placeholder="Nome do aluno">
        <input id="sala" placeholder="Sala">
        <input id="turma" placeholder="Turma">
        <input id="emergencia" placeholder="Nº de emergência">
        <input id="encarregado" placeholder="Nº do encarregado">
        <button id="btn-registar">Registar</button>
      </div>
      <p id="msg"></p>
    </section>

    <section class="cartao">
      <h2>Pesquisar aluno</h2>
      <input id="pesquisa" placeholder="Escreva o nome...">
      <div id="resultados"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
