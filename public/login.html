<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – Caderneta de Comportamento</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
  <div class="login-caixa">
    <aside class="login-lado">
      <div class="logo-grande">📘</div>
      <h1>Caderneta de Comportamento</h1>
      <p>Acompanhamento de alunos para professores e coordenadores.</p>
    </aside>

    <form id="form-login" class="login-form">
      <h2>Bem-vindo(a)</h2>
      <p class="suave">Entre com a sua conta para continuar.</p>

      <label>Utilizador
        <input id="utilizador" autocomplete="username" required autofocus>
      </label>
      <label>Palavra-passe
        <input id="senha" type="password" autocomplete="current-password" required>
      </label>

      <p id="erro-login" class="erro"></p>
      <button class="btn btn-grande" type="submit">Entrar</button>
    </form>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
